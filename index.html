<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FWFF Record Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
  :root{--bg:#EFF2EE;--surface:#FBFCFA;--ink:#141A17;--ink-2:#4E5A53;--ink-3:#5F6B64;--line:#D8DED8;
    --line-2:#C3CCC4;--violet:#6F3D96;--pink:#B8357A;--red-t:#B23A48;--on-bar:#fff}
  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121613;--surface:#1A1F1B;--ink:#E6ECE7;
    --ink-2:#A8B4AC;--ink-3:#8A968E;--line:#2A322C;--line-2:#3A443D;--violet:#A374CC;--pink:#E58AB8;
    --red-t:#E06A72;--on-bar:#121613}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:16px/1.5 "Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:flex-start;justify-content:center;padding:max(12vh,48px) 16px 48px}
  .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:4px;
    padding:22px 20px 20px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,var(--violet),var(--pink) 55%,transparent)}
  .eyebrow{font:600 12px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  h1{font:700 32px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:4px 0 18px;letter-spacing:.005em}
  label{display:block;font:600 15px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
  input{width:100%;font:16px "Source Serif 4",Georgia,serif;padding:11px 12px;min-height:46px;color:var(--ink);
    background:var(--bg);border:1px solid var(--line-2);border-radius:3px}
  input:focus{outline:2px solid var(--violet);outline-offset:1px}
  button{width:100%;margin-top:12px;min-height:46px;border:0;border-radius:3px;background:var(--violet);color:var(--on-bar);
    font:700 17px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  button[disabled]{opacity:.6;cursor:default}
  .msg{min-height:22px;margin:12px 0 0;font-size:14px;color:var(--ink-2)}
  .msg.bad{color:var(--red-t)}
  .foot{margin:16px 0 0;font-size:12.5px;color:var(--ink-3)}
  .opening{text-align:center;font:600 18px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);padding:24px 0}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="opening" id="opening" hidden>Opening the Record Book…</div>
  <form id="form" autocomplete="off" hidden>
    <div class="eyebrow">Fantasy World Fantasy Football</div>
    <h1>Record Book</h1>
    <label for="who">Who are you?</label>
    <input id="who" name="who" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
      placeholder="Your name in the league" required>
    <button id="go" type="submit">Open</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <p class="foot">League members only. This device remembers you until you log out (gear menu).</p>
  </form>
  <noscript><p>The Record Book needs JavaScript turned on.</p></noscript>
</main>

    }).then(function (w) {
      info = JSON.parse(dec(w));
      return S.importKey('raw', b64(info.k), {name: 'AES-GCM'}, false, ['decrypt']);
    }).then(function (ck) {
      return S.decrypt({name: 'AES-GCM', iv: b64(LOCK.iv)}, ck, b64(LOCK.ct));
    }).then(function (page) {
      return {who: info.who, html: dec(page)};
    });
  }

  function open(name, first) {
    return unlock(name).then(function (r) {
      store('fwff-who', name);
      // the phone's From pick (Live, My week, trash talk) starts as you; still changeable
      // a guest is nobody in the league, so no From pick is set for them (s144.7)
      if (r.who !== 'Guest' && (first || !store('fwff.me'))) store('fwff.me', r.who);
      try { sessionStorage.setItem('fwff-who-name', r.who); } catch (e) {}
      document.open(); document.write(r.html); document.close();
    });
  }

  if (!S) {
    form.hidden = false; go.disabled = true;
    show('This browser is too old to open the Record Book. Try Chrome or a phone.', true);
    return;
  }

  var saved = store('fwff-who');
  if (saved) {
    opening.hidden = false;
    open(saved, false).catch(function () { store('fwff-who', null); askName(); });
  } else {
    askName();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = who.value.replace(/\s+/g, ' ').trim().toLowerCase();
    if (!name) return;
    go.disabled = true; show('Checking…');
    open(name, true).catch(function (err) {
      go.disabled = false;
      show(err && err.message === 'name' ? "That name isn't on the list. Use your name as the Record Book shows it."
                                         : 'Something went wrong opening the page. Try again.', true);
    });
  });
})();
</script>
</body>
</html>
